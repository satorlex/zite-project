<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZiTE | Tech Innovations</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,900;1,900&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --zite-blue: #00d2ff;
            --zite-purple: #9d50bb;
            --zite-gradient: linear-gradient(90deg, #00d2ff 0%, #9d50bb 100%);
            --dark-bg: #030708;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: white; overflow: hidden; font-family: 'Inter', sans-serif; }

        /* --- TECH BACKGROUND (UNTOUCHED) --- */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111d2b 0%, #030708 100%);
            overflow: hidden;
        }

        .grid-overlay {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(to right, rgba(0, 210, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 1;
            background: linear-gradient(0deg, rgba(0, 210, 255, 0) 0%, rgba(0, 210, 255, 0.05) 50%, rgba(0, 210, 255, 0) 100%);
            position: absolute;
            bottom: 100%;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        /* --- NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 10%;
            z-index: 10;
        }

        .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-bolt {
            width: 30px;
            height: 30px;
            background: var(--zite-gradient);
            clip-path: polygon(40% 0%, 40% 45%, 100% 45%, 60% 100%, 60% 55%, 0% 55%);
        }
        .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.8rem; color: #fff; }

        /* --- HERO CENTER --- */
        .hero-center {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 5;
        }

        .hero-center h1 {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            line-height: 0.85;
            margin-bottom: 25px;
            background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,0.2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- BUTTON AS A LINK (NO HYPERLINK LINE) --- */
        .cta-btn {
            background: var(--zite-gradient);
            color: white;
            padding: 20px 60px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            
            /* The fix for your request */
            text-decoration: none; 
            display: inline-block; 
            
            border: none;
            transition: 0.4s;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }

        .cta-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(157, 80, 187, 0.5);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="grid-overlay" id="grid"></div>
        <div class="scanline"></div>
    </div>

    <section id="main-hero">
        <nav>
            <a href="#" class="logo-container">
                <div class="logo-bolt"></div>
                <div class="logo-text">ZiTE</div>
            </a>
            <div style="font-size: 0.7rem; letter-spacing: 2px; color: #555;">CREATIVE WEB INNOVATIONS</div>
        </nav>

        <div class="hero-center">
            <h2>System Online</h2>
            <h1>Untouchable</h1>
            <p style="margin-bottom: 40px; color: #888; letter-spacing: 4px;">Where Ideas Become Systems</p>
            
            <a href="Hero.html" class="cta-btn">Enter My World</a>
        </div>
    </section>

    <script>
        const grid = document.getElementById('grid');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            grid.style.transform = `perspective(500px) rotateX(60deg) translateX(${x}px) translateY(${y}px)`;
        });
    </script>
</body>
</html>
